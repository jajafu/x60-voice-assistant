name: Build release APK (manual)

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare model assets
        shell: powershell
        run: |
          .\scripts\prepare-m1-kws-assets.ps1
          .\scripts\prepare-bundled-xasr.ps1

      - name: Restore release keystore
        shell: powershell
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:RELEASE_KEYSTORE_BASE64)) {
            throw "Missing secret RELEASE_KEYSTORE_BASE64. Upload the release keystore first (see docs/release-signing.md)."
          }
          $bytes = [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\app\ci-release.keystore", $bytes)

      - name: Build signed release APK
        shell: powershell
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}\app\ci-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: .\gradlew.bat assembleRelease

      - name: Discard restored keystore
        if: always()
        shell: powershell
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:GITHUB_WORKSPACE\app\ci-release.keystore"

      - name: Show APK checksum
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 app\build\outputs\apk\release\app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
