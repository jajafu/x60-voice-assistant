name: Build release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android packages
        shell: powershell
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { 'y' } | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare model assets
        shell: powershell
        run: |
          .\scripts\prepare-m1-kws-assets.ps1
          .\scripts\prepare-vad-asset.ps1

      - name: Set release version
        shell: powershell
        run: |
          $line = Select-String -Path app/build.gradle.kts -Pattern 'versionName = "(.*)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            if ($tagVersion -ne $version) { throw "Tag v$tagVersion does not match versionName $version." }
          }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Version match: $version"

      - name: Restore release keystore
        shell: powershell
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:RELEASE_KEYSTORE_BASE64)) {
            throw "Missing secret RELEASE_KEYSTORE_BASE64. Upload the release keystore first (see docs/release-signing.md)."
          }
          $bytes = [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\app\ci-release.keystore", $bytes)

      - name: Build signed release APK
        shell: powershell
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}\app\ci-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: .\gradlew.bat assembleRelease

      - name: Discard restored keystore
        if: always()
        shell: powershell
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:GITHUB_WORKSPACE\app\ci-release.keystore"

      - name: Show APK checksum
        shell: powershell
        run: |
          Get-FileHash -Algorithm SHA256 app\build\outputs\apk\release\app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release with changelog
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $apk = "app\build\outputs\apk\release\app-release.apk"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $apk --clobber
          } else {
            gh release create $tag $apk --target "${{ github.sha }}" --title $tag --generate-notes
          }

      - name: Publish APK to public releases repo
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:RELEASES_REPO_TOKEN)) {
            Write-Output "Skipped: RELEASES_REPO_TOKEN is not configured (see docs/release-signing.md)."
            exit 0
          }
          $tag = $env:RELEASE_TAG
          $apk = "app\build\outputs\apk\release\app-release.apk"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes = (gh release view $tag --json body --jq .body) -join "`n"
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          $env:GH_TOKEN = $env:RELEASES_REPO_TOKEN
          $existing = gh release view $tag --repo jajafu/x60-voice-assistant-releases 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $apk --repo jajafu/x60-voice-assistant-releases --clobber
          } else {
            gh release create $tag $apk --repo jajafu/x60-voice-assistant-releases --target "${{ github.sha }}" --title $tag --notes-file $notesFile
          }
