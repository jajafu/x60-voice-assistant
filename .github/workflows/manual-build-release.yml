name: Manual build release APK

# 手動觸發編譯正式 APK，不設 push/PR 自動觸發。
# 由 Actions 頁按 Run workflow 執行，輸入 Release tag 後直接建立公開 Release。
#
# 必要 Secrets（Repository Settings → Secrets and variables → Actions）：
#   RELEASE_KEYSTORE_BASE64    正式 keystore 的 base64 內容（keystore 本人不上 Git）
#   RELEASE_KEYSTORE_PASSWORD  keystore 密碼
#   RELEASE_KEY_ALIAS          key 別名
#   RELEASE_KEY_PASSWORD       key 密碼
#
# 注意：含模型 APK 的公開 Release 屬再散布，授權風險見 docs/known-issues.md M1 與 docs/app-update.md。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag，例如 v1.0.1（必須唯一；將直接建立公開 Release）'
        required: true
      release_notes:
        description: 'Release 說明（繁中簡短）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/x60-models
          key: x60-models-v1

      - name: Prepare model assets
        shell: pwsh
        run: |
          ./scripts/prepare-m1-kws-assets.ps1 -CacheDirectory "$HOME/.cache/x60-models/kws"
          ./scripts/prepare-bundled-xasr.ps1 -CacheDirectory "$HOME/.cache/x60-models/asr"

      - name: Decode release keystore
        shell: bash
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret. See the header comments of this workflow."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build and test release
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease

      - name: Read app version
        id: version
        shell: bash
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::Cannot parse versionName/versionCode from app/build.gradle.kts."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Package release assets
        shell: bash
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="x60-assistant-${{ steps.version.outputs.name }}-release.apk"
          cp "$APK_SRC" "$RUNNER_TEMP/$APK_NAME"
          (cd "$RUNNER_TEMP" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          APK_URL="https://github.com/jajafu/x60-voice-assistant/releases/download/${RELEASE_TAG}/${APK_NAME}"
          APK_SHA=$(cut -d' ' -f1 "$RUNNER_TEMP/$APK_NAME.sha256")
          { echo '{'
            echo "  \"versionCode\": ${{ steps.version.outputs.code }},"
            echo "  \"versionName\": \"${{ steps.version.outputs.name }}\","
            echo "  \"apkUrl\": \"$APK_URL\","
            echo "  \"sha256\": \"$APK_SHA\","
            echo "  \"notes\": ${{ toJSON(inputs.release_notes) }}"
            echo '}'
          } > "$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.APK_NAME }}
            ${{ runner.temp }}/${{ env.APK_NAME }}.sha256
            ${{ runner.temp }}/update.json

      - name: Create public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="${{ inputs.release_notes }}"
          if [ -z "$NOTES" ]; then NOTES="手動建置 release；詳見關聯 Issue。"; fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/$APK_NAME" \
            "$RUNNER_TEMP/$APK_NAME.sha256" \
            "$RUNNER_TEMP/update.json" \
            --title "$RELEASE_TAG" \
            --notes "$NOTES"
