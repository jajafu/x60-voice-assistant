name: Bug
description: 記錄實際與預期行為，供修正與驗證。
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: 實際發生什麼？
      description: 可附環境、版本與影響範圍。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期應如何？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重現方式與證據
      description: 若無法穩定重現，寫已嘗試的步驟；移除個資與密鑰。
    validations:
      required: false
